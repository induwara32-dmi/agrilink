openapi: 3.1.0
info:
  title: AgriLink REST API
  version: 1.0.0
  description: Versioned REST API for AgriLink. Monetary and quantity values are serialized as decimal strings. All
    timestamps are UTC ISO 8601 values.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Production template
tags:
  - name: System
  - name: Authentication
  - name: Catalog
  - name: Inventory
  - name: Cart and checkout
  - name: Orders
  - name: Logistics
  - name: Vehicles
  - name: Notifications
  - name: Analytics
  - name: Media
paths:
  /health:
    get:
      tags:
        - System
      summary: Check API liveness
      operationId: getHealth
      security: []
      parameters: []
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": &a1
          $ref: "#/components/responses/BadRequest"
        "401": &a2
          $ref: "#/components/responses/Unauthorized"
        "403": &a3
          $ref: "#/components/responses/Forbidden"
        "404": &a4
          $ref: "#/components/responses/NotFound"
        "409": &a5
          $ref: "#/components/responses/Conflict"
        "429": &a6
          $ref: "#/components/responses/RateLimited"
        "500": &a7
          $ref: "#/components/responses/ServerError"
  /readiness:
    get:
      tags:
        - System
      summary: Check database readiness
      operationId: getReadiness
      security: []
      parameters: []
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
  /version:
    get:
      tags:
        - System
      summary: Get application version
      operationId: getVersion
      security: []
      parameters: []
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a buyer, farmer, or transporter
      operationId: postAuthRegister
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: buyer@example.com
              password: StrongPass!123
              firstName: Asha
              lastName: Perera
              role: BUYER
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in
      operationId: postAuthLogin
      security: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: buyer@example.com
              password: StrongPass!123
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
