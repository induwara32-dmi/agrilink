      operationId: getAuthMe
      security:
        - bearerAuth: []
      parameters: []
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
  /products:
    get:
      tags:
        - Catalog
      summary: List public products
      operationId: getProducts
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number, starting at 1
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          description: Items per page (maximum 100)
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Case-insensitive search text
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          description: Category UUID
          schema:
            type: string
            format: uuid
        - name: farmerId
          in: query
          required: false
          description: Farmer profile UUID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Resource status filter
          schema:
            type: string
        - name: minPrice
          in: query
          required: false
          description: Minimum decimal price
          schema:
            type: string
        - name: maxPrice
          in: query
          required: false
          description: Maximum decimal price
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: "Sort: newest, oldest, priceAsc, priceDesc, nameAsc, or nameDesc"
          schema:
            type: string
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
    post:
      tags:
        - Catalog
      summary: Create a product
      operationId: postProducts
      description: "Allowed roles: FARMER, ADMIN. Ownership and lifecycle checks may further restrict access."
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
            example:
              categoryId: "{{categoryId}}"
              name: Organic Tomatoes
              description: Freshly harvested organic tomatoes.
              unit: kg
              unitPrice: "4.50"
              currency: USD
              initialQuantity: "100"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
