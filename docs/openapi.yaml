components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        data: {}
        meta:
          type: object
          additionalProperties: true
      required:
        - success
        - data
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
      required:
        - success
        - error
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 7
          maxLength: 32
        role:
          type: string
          enum:
            - BUYER
            - FARMER
            - TRANSPORTER
        farmName:
          type: string
          minLength: 2
          maxLength: 180
        businessName:
          type: string
          minLength: 2
          maxLength: 180
      required:
        - email
        - password
        - firstName
        - lastName
        - role
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    TokenRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
      required:
        - token
    EmailRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
        - email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 64
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 128
      required:
        - token
        - password
    ProductRequest:
      type: object
      additionalProperties: false
      properties:
        farmerId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 180
        slug:
          type: string
        description:
          type: string
          minLength: 10
          maxLength: 10000
        sku:
          type: string
        unit:
          type: string
          maxLength: 40
        unitPrice:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
        currency:
          type: string
          minLength: 3
          maxLength: 3
        minOrderQuantity:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - OUT_OF_STOCK
            - ARCHIVED
        initialQuantity:
          type: string
        reorderLevel:
          type: string
      required:
        - categoryId
        - name
        - description
        - unit
        - unitPrice
        - currency
    ProductUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 180
        slug:
          type: string
        description:
          type: string
          minLength: 10
          maxLength: 10000
        sku:
          type: string
        unit:
          type: string
          maxLength: 40
        unitPrice:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
        currency:
          type: string
          minLength: 3
          maxLength: 3
        minOrderQuantity:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - OUT_OF_STOCK
            - ARCHIVED
    CategoryRequest:
      type: object
      additionalProperties: false
      properties:
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
        description:
          type: string
          maxLength: 5000
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
      required:
        - name
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
        description:
          type: string
          maxLength: 5000
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
    InventorySettingsRequest:
      type: object
      additionalProperties: false
      properties:
        reorderLevel:
          type:
            - string
            - "null"
      required:
        - reorderLevel
    InventoryAdjustmentRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - STOCK_IN
            - RETURN
            - ADJUSTMENT
            - DAMAGE
            - EXPIRY
        quantity:
          type: string
        reason:
          type: string
          maxLength: 255
      required:
        - type
        - quantity
    CartItemRequest:
      type: object
      additionalProperties: false
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: string
        deliveryMethod:
          type: string
          enum:
            - FARMER_DELIVERY
            - BUYER_PICKUP
            - PLATFORM_TRANSPORTER
      required:
        - productId
        - quantity
    CartItemUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        quantity:
          type: string
        deliveryMethod:
          type:
            - string
            - "null"
          enum:
            - FARMER_DELIVERY
            - BUYER_PICKUP
            - PLATFORM_TRANSPORTER
            - null
        savedForLater:
          type: boolean
    DeliveryAddress:
      type: object
      additionalProperties: false
      properties:
        recipientName:
          type: string
        recipientPhone:
          type: string
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        district:
          type: string
        region:
          type: string
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
      required:
        - recipientName
        - recipientPhone
        - line1
        - city
        - countryCode
    CheckoutGroup:
      type: object
      additionalProperties: false
      properties:
        farmerId:
          type: string
          format: uuid
        deliveryMethod:
          type: string
          enum:
            - FARMER_DELIVERY
            - BUYER_PICKUP
            - PLATFORM_TRANSPORTER
        deliveryAddressId:
          type: string
          format: uuid
        deliveryAddress:
          $ref: "#/components/schemas/DeliveryAddress"
        buyerNotes:
          type: string
          maxLength: 2000
      required:
        - farmerId
        - deliveryMethod
    CheckoutPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutGroup"
        couponCode:
          type: string
          maxLength: 64
      required:
        - groups
    CheckoutRequest:
      type: object
      additionalProperties: false
      properties:
        groups:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CheckoutGroup"
        couponCode:
          type: string
          maxLength: 64
        paymentProvider:
          type: string
          minLength: 2
          maxLength: 80
      required:
        - groups
        - paymentProvider
    AssignmentRequest:
      type: object
      additionalProperties: false
      properties:
        transporterId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
      required:
        - transporterId
        - vehicleId
    JobAcceptanceRequest:
      type: object
      additionalProperties: false
      properties:
        vehicleId:
          type: string
          format: uuid
    JobRejectionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 255
    DeliveryScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        scheduledPickupAt:
          type: string
          format: date-time
        vehicleId:
          type: string
          format: uuid
      required:
        - scheduledPickupAt
    DeliveryTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - PENDING
            - AWAITING_ASSIGNMENT
            - ASSIGNED
            - ACCEPTED
            - REJECTED
            - PICKUP_SCHEDULED
            - READY_FOR_PICKUP
            - PICKED_UP
            - IN_TRANSIT
            - DELIVERED
            - FAILED
            - CANCELLED
        note:
          type: string
          maxLength: 255
        latitude:
          type: string
        longitude:
          type: string
      required:
        - status
    VehicleRequest:
      type: object
      additionalProperties: false
      properties:
        ownerId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - BICYCLE
            - MOTORCYCLE
            - TRICYCLE
            - CAR
            - PICKUP_TRUCK
            - VAN
            - REFRIGERATED_VAN
            - TRUCK
            - OTHER
        registrationNumber:
          type: string
        make:
          type: string
        model:
          type: string
        color:
          type: string
        capacity:
          type: string
        capacityUnit:
          type: string
        isActive:
          type: boolean
      required:
        - type
        - registrationNumber
    VehicleUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        make:
          type: string
        model:
          type: string
        color:
          type: string
        capacity:
          type: string
        capacityUnit:
          type: string
        isActive:
          type: boolean
    NotificationRequest:
      type: object
      additionalProperties: false
      properties:
        recipientId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - ACCOUNT
            - ORDER
            - DELIVERY
            - PAYMENT
            - MESSAGE
            - REVIEW
            - SYSTEM
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - IN_APP
              - EMAIL
        title:
          type: string
          maxLength: 180
        body:
          type: string
          maxLength: 10000
        data:
          type: object
          additionalProperties:
            type:
              - string
              - number
              - boolean
              - "null"
      required:
        - recipientId
        - type
        - channels
        - title
        - body
    NotificationUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - UNREAD
            - READ
            - ARCHIVED
      required:
        - status
    ImageOrderRequest:
      type: object
      additionalProperties: false
      properties:
        imageIds:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
        - imageIds
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient role, ownership, or lifecycle permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
