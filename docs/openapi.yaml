        - Catalog
      summary: Get a public product
      operationId: getProductsId
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: id UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
    patch:
      tags:
        - Catalog
      summary: Update a product
      operationId: patchProductsId
      description: "Allowed roles: FARMER, ADMIN. Ownership and lifecycle checks may further restrict access."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: id UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
            example:
              name: Premium Organic Tomatoes
              unitPrice: "4.75"
      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
    delete:
      tags:
        - Catalog
      summary: Soft-delete a product
      operationId: deleteProductsId
      description: "Allowed roles: FARMER, ADMIN. Ownership and lifecycle checks may further restrict access."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: id UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request succeeded
