      responses:
        "200":
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400": *a1
        "401": *a2
        "403": *a3
        "404": *a4
        "409": *a5
        "429": *a6
        "500": *a7
  /auth/forgot-password:
    post:
      tags:
